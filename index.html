<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alarm</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f0f0f;
      color: #fff;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 40px;
    }

    .current-time {
      font-size: 72px;
      font-weight: 200;
      letter-spacing: 4px;
      font-variant-numeric: tabular-nums;
    }

    .alarm-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .label {
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #666;
    }

    input[type="time"] {
      background: transparent;
      border: none;
      border-bottom: 1px solid #333;
      color: #fff;
      font-size: 36px;
      font-weight: 200;
      text-align: center;
      padding: 8px 0;
      outline: none;
      letter-spacing: 2px;
      width: 180px;
      cursor: pointer;
    }

    input[type="time"]::-webkit-calendar-picker-indicator {
      filter: invert(1);
      opacity: 0.3;
      cursor: pointer;
    }

    input[type="time"]:focus {
      border-bottom-color: #fff;
    }

    button {
      background: transparent;
      border: 1px solid #333;
      color: #fff;
      font-size: 13px;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 12px 32px;
      cursor: pointer;
      transition: all 0.2s;
      border-radius: 2px;
    }

    button:hover {
      border-color: #fff;
    }

    button.active {
      background: #fff;
      color: #0f0f0f;
      border-color: #fff;
    }

    .status {
      font-size: 12px;
      letter-spacing: 1px;
      color: #444;
      height: 16px;
    }

    .status.set {
      color: #888;
    }

    body.ringing {
      animation: flash 0.5s ease-in-out infinite alternate;
    }

    @keyframes flash {
      from { background: #0f0f0f; }
      to   { background: #1a1a0a; }
    }

    body.ringing .current-time {
      color: #f5c542;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="current-time" id="clock">00:00:00</div>

    <div class="alarm-section">
      <div class="label">Alarm</div>
      <input type="time" id="alarm-input" />
      <button id="toggle-btn">Set</button>
      <div class="status" id="status"></div>
    </div>
  </div>

  <audio id="beep" preload="auto"></audio>

  <script>
    const clockEl   = document.getElementById('clock');
    const inputEl   = document.getElementById('alarm-input');
    const btnEl     = document.getElementById('toggle-btn');
    const statusEl  = document.getElementById('status');

    let alarmTime  = null;
    let ringing    = false;
    let audioCtx   = null;
    let beepInterval = null;

    function tick() {
      const now = new Date();
      const hh  = String(now.getHours()).padStart(2, '0');
      const mm  = String(now.getMinutes()).padStart(2, '0');
      const ss  = String(now.getSeconds()).padStart(2, '0');
      clockEl.textContent = `${hh}:${mm}:${ss}`;

      if (alarmTime && !ringing) {
        const current = `${hh}:${mm}`;
        if (current === alarmTime && ss === '00') startRinging();
      }
    }

    function startRinging() {
      ringing = true;
      document.body.classList.add('ringing');
      statusEl.textContent = 'Wake up!';
      statusEl.classList.add('set');
      btnEl.textContent = 'Stop';
      btnEl.classList.add('active');
      beepInterval = setInterval(playBeep, 800);
      playBeep();
    }

    function stopRinging() {
      ringing    = false;
      alarmTime  = null;
      document.body.classList.remove('ringing');
      clearInterval(beepInterval);
      btnEl.textContent = 'Set';
      btnEl.classList.remove('active');
      statusEl.textContent = '';
      statusEl.classList.remove('set');
    }

    function playBeep() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc  = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.type      = 'sine';
      osc.frequency.setValueAtTime(880, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.4);
    }

    btnEl.addEventListener('click', () => {
      if (ringing) {
        stopRinging();
        return;
      }
      if (alarmTime) {
        alarmTime = null;
        btnEl.textContent = 'Set';
        btnEl.classList.remove('active');
        statusEl.textContent = '';
        statusEl.classList.remove('set');
        return;
      }
      const val = inputEl.value;
      if (!val) { statusEl.textContent = 'Please select a time'; return; }
      alarmTime = val;
      btnEl.textContent = 'Cancel';
      btnEl.classList.add('active');
      statusEl.textContent = `Set for ${val}`;
      statusEl.classList.add('set');
    });

    setInterval(tick, 1000);
    tick();
  </script>
</body>
</html>
